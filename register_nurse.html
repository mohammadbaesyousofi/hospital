<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="سیستم مدیریت شفاخانه یوسفی">
<title>ثبت نرس</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar">
<div class="sidebar-brand"><span class="brand-icon">🏥</span> شفاخانه یوسفی</div>
<ul class="sidebar-nav">
<li><a href="dashboard.html"><span>▦</span>داشبورد</a></li>
<li><a href="doctors.html"><span>👨‍⚕️</span>داکتران</a></li>
<li><a href="nurses.html"><span>👩‍⚕️</span>نرس‌ها</a></li>
<li><a href="patients.html"><span>🧑</span>مریضان</a></li>
<li><a href="appointments.html"><span>📅</span>نوبت دهی</a></li>
<li><a href="medical_records.html"><span>📋</span>سوابق مریضی</a></li>
<li><a href="setting.html"><span>⚙</span>تنظیمات</a></li>
<li><a class="logout" href="index.html"><span>↪</span> خروج</a></li>
</ul>
</aside>
<main class="main">
<div class="topbar">
<button class="mobile-menu" aria-label="منوی موبایل">☰</button>
<div><h1>ثبت نرس جدید</h1><span class="muted">سیستم مدیریت شفاخانه یوسفی</span></div>
<a class="btn btn-outline btn-sm" href="index.html">صفحه اصلی</a>
</div>
<div class="content-card">
<div class="card-head">
<h2>ثبت نرس جدید</h2>
<a class="btn btn-outline btn-sm" href="nurses.html">بازگشت به فهرست</a>
</div>
<div class="alert alert-success form-message hidden"></div>
<form data-registration="nurse" class="form-grid">
<div class="form-group"><label>نام و نام خانوادگی *</label><input class="form-control" name="name" required placeholder="نام نرس"></div>
<div class="form-group"><label>نام پدر</label><input class="form-control" name="father" placeholder="نام پدر"></div>
<div class="form-group"><label>شماره تماس *</label><input class="form-control" name="phone" required inputmode="tel" placeholder="07xxxxxxxx"></div>
<div class="form-group"><label>مدرک تحصیلی *</label><select class="form-control" name="qualification" required><option value="">انتخاب مدرک</option><option>قابله</option><option>نرسنگ</option><option>لیسانس نرسنگ</option><option>دیپلوم نرسنگ</option><option>دیگر</option></select></div>
<div class="form-group"><label>شیفت کاری</label><select class="form-control" name="shift"><option>صبح</option><option>بعد از ظهر</option><option>شب</option><option>چرخشی</option></select></div>
<div class="form-group"><label>سابقه کاری</label><input class="form-control" name="experience" placeholder="مثلاً ۳ سال"></div>
<div class="form-group"><label>جنسیت</label><select class="form-control" name="gender"><option>زن</option><option>مرد</option></select></div>
<div class="form-group"><label>وضعیت</label><select class="form-control" name="status"><option>فعال</option><option>در رخصتی</option><option>غیرفعال</option></select></div>
<div class="form-group full"><label>آدرس</label><input class="form-control" name="address" placeholder="آدرس محل سکونت"></div>
<div class="form-group full"><label>یادداشت</label><textarea class="form-control" name="note" placeholder="معلومات اضافی درباره نرس"></textarea></div>
<div class="full" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" type="submit">ثبت نرس</button><a class="btn btn-outline" href="nurses.html">انصراف</a></div>
</form>
</div>
</main>
</div>
<script src="script.js"></script>
</body>
</html>
