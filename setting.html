<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="سیستم مدیریت شفاخانه یوسفی" />
    <title>تنظیمات سیستم</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-icon">🏥</span> شفاخانه یوسفی
        </div>
        <ul class="sidebar-nav">
          <li>
            <a class="" href="dashboard.html"><span>▦</span>داشبورد</a>
          </li>
          <li>
            <a class="" href="doctors.html"><span>👨‍⚕️</span>داکتران</a>
          </li>
          <li>
            <a class="" href="nurses.html"><span>👩‍⚕️</span>پرسونل</a>
          </li>
          <li>
            <a class="" href="patients.html"><span>🧑</span>مریضان</a>
          </li>
          <li>
            <a class="" href="appointments.html"><span>📅</span>نوبت دهی</a>
          </li>
          <li>
            <a class="" href="medical_records.html"
              ><span>📋</span>سوابق مریضی</a
            >
          </li>
          <li>
            <a class="active" href="setting.html"><span>⚙</span>تنظیمات</a>
          </li>
          <li>
            <a class="logout" href="index.html"><span>↪</span> خروج</a>
          </li>
        </ul>
      </aside>
      <main class="main">
        <div class="topbar">
          <button class="mobile-menu" aria-label="منوی موبایل">☰</button>
          <div>
            <h1>تنظیمات سیستم</h1>
            <span class="muted">سیستم مدیریت شفاخانه یوسفی</span>
          </div>
          <a class="btn btn-outline btn-sm" href="index.html">صفحه اصلی</a>
        </div>

        <form>
          <div class="settings-card">
            <h2>🏥 معلومات عمومی شفاخانه</h2>
            <div class="form-grid">
              <div class="form-group">
                <label>نام شفاخانه</label
                ><input class="form-control" value="شفاخانه یوسفی" />
              </div>
              <div class="form-group">
                <label>شماره تماس</label
                ><input class="form-control" placeholder="شماره تماس رسمی" />
              </div>
              <div class="form-group full">
                <label>آدرس</label
                ><input class="form-control" placeholder="آدرس شفاخانه" />
              </div>
              <div class="form-group full">
                <label>درباره شفاخانه</label
                ><textarea
                  class="form-control"
                  placeholder="معلومات رسمی درباره شفاخانه"></textarea>
              </div>
            </div>
          </div>
          <div class="settings-card">
            <h2>🔐 تغییر رمز عبور</h2>
            <div class="form-grid">
              <div class="form-group">
                <label>رمز فعلی</label
                ><input type="password" class="form-control" />
              </div>
              <div class="form-group">
                <label>رمز جدید</label
                ><input type="password" class="form-control" />
              </div>
              <div class="form-group">
                <label>تکرار رمز جدید</label
                ><input type="password" class="form-control" />
              </div>
            </div>
          </div>
          <button
            type="button"
            class="btn btn-primary"
            onclick="
              alert(
                'در نسخه PHP، این دکمه باید اطلاعات را در دیتابیس ذخیره کند.',
              )
            ">
            ذخیره تغییرات
          </button>
        </form>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
