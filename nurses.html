<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="سیستم مدیریت شفاخانه یوسفی" />
    <title>مدیریت پرسونل</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-icon">🏥</span> شفاخانه یوسفی
        </div>
        <ul class="sidebar-nav">
          <li>
            <a class="" href="dashboard.html"><span>▦</span>داشبورد</a>
          </li>
          <li>
            <a class="" href="doctors.html"><span>👨‍⚕️</span>داکتران</a>
          </li>
          <li>
            <a class="active" href="nurses.html"><span>👩‍⚕️</span>پرسونل</a>
          </li>
          <li>
            <a class="" href="patients.html"><span>🧑</span>مریضان</a>
          </li>
          <li>
            <a class="" href="appointments.html"><span>📅</span>نوبت دهی</a>
          </li>
          <li>
            <a class="" href="medical_records.html"
              ><span>📋</span>سوابق مریضی</a
            >
          </li>
          <li>
            <a class="" href="setting.html"><span>⚙</span>تنظیمات</a>
          </li>
          <li>
            <a class="logout" href="index.html"><span>↪</span> خروج</a>
          </li>
        </ul>
      </aside>
      <main class="main">
        <div class="topbar">
          <button class="mobile-menu" aria-label="منوی موبایل">☰</button>
          <div>
            <h1>مدیریت پرسونل</h1>
            <span class="muted">سیستم مدیریت شفاخانه یوسفی</span>
          </div>
          <a class="btn btn-outline btn-sm" href="index.html">صفحه اصلی</a>
        </div>

        <div class="content-card">
          <div class="card-head">
            <h2>فهرست پرسونل</h2>
            <button class="btn btn-primary btn-sm"><a href="register_nurse.html">+ اضافه کردن پرسونل</a></button>
          </div>
          <div class="toolbar">
            <input
              class="form-control search"
              data-search="#staff tbody tr"
              placeholder="جستجوی نام یا وظیفه..." />
          </div>
          <div class="table-wrap">
            <table id="staff">
              <thead>
                <tr>
                  <th>نام</th>
                  <th>وظیفه</th>
                  <th>شماره تماس</th>
                  <th>وضعیت</th>
                  <th>عملیات</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>سارا محمدی</td>
                  <td>نرس</td>
                  <td>۰۷۸۸۰۰۱۱۲۲</td>
                  <td><span class="badge badge-success">فعال</span></td>
                  <td>
                    <div class="actions">
                      <button class="btn btn-outline btn-sm">ویرایش</button
                      ><button
                        class="btn btn-danger btn-sm"
                        data-confirm="این مورد حذف شود؟">
                        حذف
                      </button>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td>مریم احمدی</td>
                  <td>نرس</td>
                  <td>۰۷۷۱۱۲۲۳۳۴</td>
                  <td><span class="badge badge-success">فعال</span></td>
                  <td>
                    <div class="actions">
                      <button class="btn btn-outline btn-sm">ویرایش</button
                      ><button
                        class="btn btn-danger btn-sm"
                        data-confirm="این مورد حذف شود؟">
                        حذف
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
