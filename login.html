<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="سیستم مدیریت شفاخانه یوسفی">
<title>ورود | سیستم مدیریت شفاخانه</title>
<link rel="stylesheet" href="style.css">

</head>
<body class="auth-page"><div class="auth-wrap">
<section class="auth-info"><div class="big-icon" style="font-size:5rem">🏥</div><h1>شفاخانه یوسفی</h1><p>به سیستم مدیریت شفاخانه خوش آمدید.</p><ul><li>✓ مدیریت داکتران و پرسونل</li><li>✓ مدیریت مریضان</li><li>✓ مدیریت نوبت‌ها و سوابق</li></ul></section>
<section class="auth-form"><a class="brand" href="index.html"><span class="brand-icon">🏥</span> شفاخانه یوسفی</a><h2 style="margin-top:25px">ورود به حساب</h2><p class="muted">برای ورود معلومات خود را وارد کنید.</p><div id="loginMessage"></div>
<form id="loginForm" style="margin-top:20px">
<div class="form-group"><label for="username">نام کاربری</label><input id="username" class="form-control" type="text" autocomplete="username" placeholder="نام کاربری"></div>
<div class="form-group"><label for="password">رمز عبور</label><div class="password-wrap"><input id="password" class="form-control" type="password" autocomplete="current-password" placeholder="رمز عبور"><button type="button" class="toggle-pass" data-target="password">نمایش</button></div></div>
<label class="check-row"><input type="checkbox"> مرا به خاطر بسپار</label>
<button class="btn btn-primary" style="width:100%" type="submit">ورود</button>
<a class="btn btn-outline" style="width:100%;margin-top:10px" href="index.html">بازگشت به صفحه اصلی</a>
</form></section></div><script src="script.js"></script></body></html>
